ckpt_root: ckpt
cuda: True 
num_workers: 8

dataset:
    name: PanoCorBonDataset
    train_kwargs:
        root_dir: /home/dy283090/wall_detection/hohonet/data/mp3d_layout/train_no_occ 
        flip: True
        rotate: True
        gamma: True
        stretch: True
    valid_kwargs:
        root_dir: /home/dy283090/wall_detection/hohonet/data/mp3d_layout/valid_no_occ 

training:
    epoch: 300
    batch_size: 4 
    save_every: 300
    optim_lr: 0.0001
    weight_decay: 0.000001
    optim_poly_gamma: 0.9

model:
    file: model.hohonet
    modelclass: HoHoNet
    kwargs:
        emb_dim: 256
        backbone_config:
            module: Resnet
            kwargs:
                backbone: resnet34
        decode_config:
            module: EfficientHeightReduction
        refine_config:
            module: TransEn
            kwargs:
                position_encode: 256
                nhead: 8
                num_layers: 1
                dim_feedforward: 2048
        modalities_config:
            LayoutEstimator:
                cor_weight: 1.
                bon_weight: 2.
                bon_loss: 3d_loss
                cor_loss: bce
                bon_scale: 1.
                dropout: 0
                oneconv: True
                last_ks: 1
                last_bias: False
                sigmod_normlize: True 
                sample_weight: False 
